
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;height:700px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;background:var(--color-background-primary)}
#canvas-wrap{flex:1;position:relative;overflow:hidden;background:#ede9e0;touch-action:none}
#overlay{position:absolute;top:0;left:0;width:100%;height:100%}
#loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:10}
#loading p{font-size:13px;color:var(--color-text-secondary);margin-top:8px}

#bottom-panel{background:var(--color-background-primary);border-top:0.5px solid var(--color-border-tertiary)}

#selectors{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:0.5px solid var(--color-border-tertiary)}
#selectors select{flex:1;min-width:0;padding:8px 10px;font-size:14px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary)}
#btn-go{padding:8px 14px;border:0.5px solid #378ADD;border-radius:var(--border-radius-md);background:#E6F1FB;color:#185FA5;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;flex-shrink:0}
#btn-go:active{opacity:.75}
#btn-reset{width:38px;height:38px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-secondary);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#btn-reset:active{opacity:.75}

#route-info{padding:8px 12px;font-size:13px;min-height:38px;max-height:90px;overflow-y:auto;color:var(--color-text-secondary)}
.step-row{display:flex;gap:8px;align-items:center;padding:3px 0;border-bottom:0.5px solid var(--color-border-tertiary)}
.step-num{font-size:11px;color:var(--color-text-secondary);min-width:18px}
.step-name{font-size:13px;color:var(--color-text-primary)}

#zoom-controls{position:absolute;bottom:12px;right:10px;display:flex;flex-direction:column;gap:4px;z-index:5}
.zoom-btn{width:36px;height:36px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.zoom-btn:active{opacity:.7}
#zoom-lbl{font-size:10px;text-align:center;color:var(--color-text-secondary)}

#node-drawer{position:absolute;bottom:0;left:0;right:0;background:var(--color-background-primary);border-top:0.5px solid var(--color-border-tertiary);border-radius:12px 12px 0 0;max-height:55%;overflow-y:auto;transform:translateY(100%);transition:transform .25s ease;z-index:20;padding-bottom:env(safe-area-inset-bottom,0)}
#node-drawer.open{transform:translateY(0)}
#drawer-handle{width:36px;height:4px;background:var(--color-border-secondary);border-radius:2px;margin:10px auto 6px}
#drawer-search{width:calc(100% - 24px);margin:0 12px 8px;padding:8px 10px;font-size:14px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-secondary);color:var(--color-text-primary)}
.drawer-section{font-size:10px;font-weight:500;color:var(--color-text-secondary);padding:8px 12px 3px;text-transform:uppercase;letter-spacing:.04em}
.drawer-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:0.5px solid var(--color-border-tertiary);cursor:pointer;font-size:14px;color:var(--color-text-primary)}
.drawer-item:active{background:var(--color-background-secondary)}
.drawer-item.sel-from{background:#E6F1FB;color:#185FA5}
.drawer-item.sel-to{background:#EAF3DE;color:#3B6D11}
.node-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.drawer-badge{margin-left:auto;font-size:11px;padding:2px 7px;border-radius:10px;font-weight:500}
.badge-from{background:#B5D4F4;color:#0C447C}
.badge-to{background:#C0DD97;color:#27500A}

#fab-list{position:absolute;bottom:12px;left:12px;z-index:5}
#fab-btn{width:44px;height:44px;border:0.5px solid var(--color-border-secondary);border-radius:50%;background:var(--color-background-primary);color:var(--color-text-primary);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#fab-btn:active{opacity:.7}
</style>

<div id="app">
  <div id="canvas-wrap">
    <canvas id="overlay"></canvas>
    <div id="loading">
      <i class="ti ti-loader" style="font-size:36px;color:var(--color-border-secondary)" aria-hidden="true"></i>
      <p id="loading-msg">Caricamento mappa…</p>
    </div>
    <div id="zoom-controls">
      <button class="zoom-btn" id="zin" aria-label="Zoom in"><i class="ti ti-plus" aria-hidden="true"></i></button>
      <div id="zoom-lbl">100%</div>
      <button class="zoom-btn" id="zout" aria-label="Zoom out"><i class="ti ti-minus" aria-hidden="true"></i></button>
      <button class="zoom-btn" id="zfit" aria-label="Fit map"><i class="ti ti-arrows-maximize" aria-hidden="true"></i></button>
    </div>
    <div id="fab-list">
      <button id="fab-btn" aria-label="Lista destinazioni"><i class="ti ti-list" aria-hidden="true"></i></button>
    </div>
  </div>

  <div id="bottom-panel">
    <div id="selectors">
      <select id="sel-from"><option value="">Da…</option></select>
      <select id="sel-to"><option value="">A…</option></select>
      <button id="btn-go"><i class="ti ti-route" aria-hidden="true"></i> Vai</button>
      <button id="btn-reset" aria-label="Reset"><i class="ti ti-refresh" aria-hidden="true"></i></button>
    </div>
    <div id="route-info">Seleziona partenza e destinazione</div>
  </div>

  <div id="node-drawer">
    <div id="drawer-handle"></div>
    <input id="drawer-search" placeholder="Cerca alloggio…" type="search">
    <div id="drawer-list"></div>
  </div>
</div>

<script>
const canvas=document.getElementById('overlay');
const ctx=canvas.getContext('2d');
const wrap=document.getElementById('canvas-wrap');
const loadingEl=document.getElementById('loading');
const routeInfoEl=document.getElementById('route-info');
const selFrom=document.getElementById('sel-from');
const selTo=document.getElementById('sel-to');
const zoomLbl=document.getElementById('zoom-lbl');
const drawer=document.getElementById('node-drawer');
const drawerList=document.getElementById('drawer-list');
const drawerSearch=document.getElementById('drawer-search');

let nodes=[], edges=[], pathIds=[], animT=0, animReq=null;
let mapImage=null, jsonMeta={};
let scale=1, offX=0, offY=0;
let mapReady=false, graphReady=false;

const NODE_COLORS={reception:'#D85A30',appartamento:'#378ADD',bungalow:'#1D9E75',servizio:'#BA7517',incrocio:'#888780'};
const MIN_SCALE=0.25, MAX_SCALE=8;
const MAP_URL='https://formazione.github.io/mappa/mappa.jpg';
const JSON_URL='https://formazione.github.io/mappa/baia_grafo3.json';

function resize(){canvas.width=wrap.clientWidth;canvas.height=wrap.clientHeight;draw();}
window.addEventListener('resize',resize);

function fitMap(){
  if(!mapImage) return;
  const s=Math.min(canvas.width/mapImage.width,canvas.height/mapImage.height);
  scale=s; offX=(canvas.width-mapImage.width*s)/2; offY=(canvas.height-mapImage.height*s)/2; draw();
}
function w2s(wx,wy){return{x:wx*scale+offX,y:wy*scale+offY};}

function nodeWXY(n){
  if(n.wx!==undefined) return{x:n.wx,y:n.wy};
  const rw=mapImage?mapImage.width:(jsonMeta.mapWidth||canvas.width);
  const rh=mapImage?mapImage.height:(jsonMeta.mapHeight||canvas.height);
  if(n.xr!==undefined) return{x:n.xr*rw,y:n.yr*rh};
  return{x:n.x||0,y:n.y||0};
}
function cpWXY(cp){
  if(cp.wx!==undefined) return{x:cp.wx,y:cp.wy};
  const rw=mapImage?mapImage.width:(jsonMeta.mapWidth||canvas.width);
  const rh=mapImage?mapImage.height:(jsonMeta.mapHeight||canvas.height);
  if(cp.xr!==undefined) return{x:cp.xr*rw,y:cp.yr*rh};
  return{x:0,y:0};
}
function edgePolyline(e){
  const na=nodes.find(n=>n.id===e.a),nb=nodes.find(n=>n.id===e.b);
  if(!na||!nb) return[];
  return[nodeWXY(na),...(e.pts||[]).map(cpWXY),nodeWXY(nb)];
}
function edgePolyLength(e){
  const poly=edgePolyline(e);
  let len=0;
  for(let i=1;i<poly.length;i++) len+=Math.hypot(poly[i].x-poly[i-1].x,poly[i].y-poly[i-1].y);
  return len;
}
function nodeRadius(n){return Math.max(5,(n.type==='reception'?11:7)*Math.min(scale,1.8));}
function isEdgeOnPath(e){
  for(let i=0;i<pathIds.length-1;i++){
    const a=pathIds[i],b=pathIds[i+1];
    if((e.a===a&&e.b===b)||(e.a===b&&e.b===a)) return true;
  }
  return false;
}
function buildRoutePoly(){
  const pts=[];
  for(let i=0;i<pathIds.length-1;i++){
    const aid=pathIds[i],bid=pathIds[i+1];
    const e=edges.find(e=>(e.a===aid&&e.b===bid)||(e.a===bid&&e.b===aid));
    if(!e) continue;
    const poly=edgePolyline(e);
    const na=nodes.find(n=>n.id===aid);
    const firstIsA=na&&Math.hypot(poly[0].x-nodeWXY(na).x,poly[0].y-nodeWXY(na).y)<1;
    const ordered=firstIsA?poly:[...poly].reverse();
    const start=pts.length===0?0:1;
    for(let j=start;j<ordered.length;j++) pts.push(w2s(ordered[j].x,ordered[j].y));
  }
  return pts;
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(mapImage) ctx.drawImage(mapImage,offX,offY,mapImage.width*scale,mapImage.height*scale);

  edges.forEach(e=>{
    const poly=edgePolyline(e);
    if(poly.length<2) return;
    const onPath=pathIds.length>1&&isEdgeOnPath(e);
    ctx.beginPath();
    const p0=w2s(poly[0].x,poly[0].y); ctx.moveTo(p0.x,p0.y);
    for(let i=1;i<poly.length;i++){const p=w2s(poly[i].x,poly[i].y);ctx.lineTo(p.x,p.y);}
    ctx.strokeStyle=onPath?'#378ADD':'rgba(80,75,65,0.35)';
    ctx.lineWidth=onPath?Math.max(3,4*scale):Math.max(1,1.5*scale);
    ctx.setLineDash([]); ctx.stroke();
  });

  if(pathIds.length>1){
    const fullPoly=buildRoutePoly();
    if(fullPoly.length>=2){
      const totalLen=fullPoly.reduce((s,p,i)=>i===0?0:s+Math.hypot(p.x-fullPoly[i-1].x,p.y-fullPoly[i-1].y),0);
      let target=animT*totalLen,run=0,ax=fullPoly[0].x,ay=fullPoly[0].y;
      for(let i=1;i<fullPoly.length;i++){
        const seg=Math.hypot(fullPoly[i].x-fullPoly[i-1].x,fullPoly[i].y-fullPoly[i-1].y);
        if(run+seg>=target){const t=(target-run)/seg;ax=fullPoly[i-1].x+(fullPoly[i].x-fullPoly[i-1].x)*t;ay=fullPoly[i-1].y+(fullPoly[i].y-fullPoly[i-1].y)*t;break;}
        run+=seg;
      }
      ctx.beginPath();ctx.arc(ax,ay,Math.max(7,9*scale),0,Math.PI*2);
      ctx.fillStyle='#185FA5';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.stroke();
    }
  }

  nodes.forEach(n=>{
    if(n.type==='incrocio') return;
    const c=nodeWXY(n);const p=w2s(c.x,c.y);
    const col=NODE_COLORS[n.type]||'#888';
    const r=nodeRadius(n);
    const isFrom=String(n.id)===selFrom.value;
    const isTo=String(n.id)===selTo.value;
    ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);
    ctx.fillStyle=col;ctx.fill();
    ctx.strokeStyle=isFrom?'#0C447C':isTo?'#27500A':pathIds.includes(n.id)?'#378ADD':'#fff';
    ctx.lineWidth=isFrom||isTo?3:1.5;ctx.stroke();
    if(scale>0.45){
      const lbl=n.name||(n.type==='reception'?'Reception':n.type);
      const fs=Math.max(10,Math.min(13,11*scale));
      ctx.font='bold '+fs+'px var(--font-sans)';ctx.textAlign='center';
      ctx.strokeStyle='rgba(255,255,255,0.92)';ctx.lineWidth=3;
      ctx.strokeText(lbl,p.x,p.y-r-4);
      ctx.fillStyle='#1a1a1a';ctx.fillText(lbl,p.x,p.y-r-4);
    }
  });
  zoomLbl.textContent=Math.round(scale*100)+'%';
}

function dijkstra(srcId,dstId){
  const dist={},prev={},visited=new Set();
  nodes.forEach(n=>dist[n.id]=Infinity);
  dist[srcId]=0;
  const queue=[...nodes.map(n=>n.id)];
  while(queue.length){
    queue.sort((a,b)=>dist[a]-dist[b]);
    const u=queue.shift();
    if(u===dstId) break;
    visited.add(u);
    edges.filter(e=>e.a===u||e.b===u).forEach(e=>{
      const vid=e.a===u?e.b:e.a;
      if(visited.has(vid)) return;
      const alt=dist[u]+edgePolyLength(e);
      if(alt<dist[vid]){dist[vid]=alt;prev[vid]=u;}
    });
  }
  if(dist[dstId]===Infinity) return null;
  const path=[];let cur=dstId;
  while(cur!==undefined){path.unshift(cur);cur=prev[cur];}
  return path;
}
function animatePath(){
  if(animReq) cancelAnimationFrame(animReq);
  animT=0;const start=performance.now(),dur=2200;
  function step(now){animT=Math.min((now-start)/dur,1);draw();if(animT<1)animReq=requestAnimationFrame(step);}
  animReq=requestAnimationFrame(step);
}

function applyZoom(factor,cx,cy){
  const ns=Math.max(MIN_SCALE,Math.min(MAX_SCALE,scale*factor));
  const r=ns/scale;offX=cx-(cx-offX)*r;offY=cy-(cy-offY)*r;scale=ns;draw();
}

let touches={}, lastDist=0, lastMidX=0, lastMidY=0;
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(e.touches.length===1){
    touches={x:e.touches[0].clientX,y:e.touches[0].clientY,ox:offX,oy:offY,moved:false};
  }
  if(e.touches.length===2){
    const dx=e.touches[1].clientX-e.touches[0].clientX;
    const dy=e.touches[1].clientY-e.touches[0].clientY;
    lastDist=Math.hypot(dx,dy);
    lastMidX=(e.touches[0].clientX+e.touches[1].clientX)/2;
    lastMidY=(e.touches[0].clientY+e.touches[1].clientY)/2;
    const r=canvas.getBoundingClientRect();
    lastMidX-=r.left; lastMidY-=r.top;
  }
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===1&&touches.x!==undefined){
    const dx=e.touches[0].clientX-touches.x, dy=e.touches[0].clientY-touches.y;
    if(Math.hypot(dx,dy)>4) touches.moved=true;
    offX=touches.ox+dx; offY=touches.oy+dy; draw();
  }
  if(e.touches.length===2){
    const dx=e.touches[1].clientX-e.touches[0].clientX;
    const dy=e.touches[1].clientY-e.touches[0].clientY;
    const dist=Math.hypot(dx,dy);
    if(lastDist>0) applyZoom(dist/lastDist,lastMidX,lastMidY);
    lastDist=dist;
    const r=canvas.getBoundingClientRect();
    lastMidX=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left;
    lastMidY=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top;
  }
},{passive:false});
canvas.addEventListener('touchend',e=>{
  if(e.changedTouches.length===1&&!touches.moved){
    const r=canvas.getBoundingClientRect();
    const sx=e.changedTouches[0].clientX-r.left, sy=e.changedTouches[0].clientY-r.top;
    const hit=nodes.find(n=>{
      if(n.type==='incrocio') return false;
      const c=nodeWXY(n);const p=w2s(c.x,c.y);
      return Math.hypot(p.x-sx,p.y-sy)<Math.max(16,nodeRadius(n)+6);
    });
    if(hit){
      if(!selFrom.value){selFrom.value=String(hit.id);}
      else if(!selTo.value&&String(hit.id)!==selFrom.value){selTo.value=String(hit.id);}
      else{selFrom.value=String(hit.id);selTo.value='';}
      buildSelects(); draw();
    }
  }
  if(e.touches.length===0) lastDist=0;
});

canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=canvas.getBoundingClientRect();
  applyZoom(e.deltaY<0?1.15:1/1.15,e.clientX-r.left,e.clientY-r.top);
},{passive:false});

let isPanning=false,panSX=0,panSY=0,panOX=0,panOY=0;
canvas.addEventListener('mousedown',e=>{if(e.button!==0)return;isPanning=true;panSX=e.clientX;panSY=e.clientY;panOX=offX;panOY=offY;});
canvas.addEventListener('mousemove',e=>{if(!isPanning)return;offX=panOX+(e.clientX-panSX);offY=panOY+(e.clientY-panSY);draw();});
canvas.addEventListener('mouseup',e=>{
  const dx=Math.abs(e.clientX-panSX),dy=Math.abs(e.clientY-panSY);
  isPanning=false;
  if(dx>4||dy>4) return;
  const r=canvas.getBoundingClientRect();
  const sx=e.clientX-r.left,sy=e.clientY-r.top;
  const hit=nodes.find(n=>{if(n.type==='incrocio')return false;const c=nodeWXY(n);const p=w2s(c.x,c.y);return Math.hypot(p.x-sx,p.y-sy)<Math.max(14,nodeRadius(n)+4);});
  if(hit){
    if(!selFrom.value) selFrom.value=String(hit.id);
    else if(!selTo.value&&String(hit.id)!==selFrom.value) selTo.value=String(hit.id);
    else{selFrom.value=String(hit.id);selTo.value='';}
    buildSelects();draw();
  }
});
canvas.addEventListener('mouseleave',()=>{isPanning=false;});

document.getElementById('zin').onclick=()=>applyZoom(1.3,canvas.width/2,canvas.height/2);
document.getElementById('zout').onclick=()=>applyZoom(1/1.3,canvas.width/2,canvas.height/2);
document.getElementById('zfit').onclick=fitMap;

document.getElementById('btn-go').onclick=go;
document.getElementById('btn-reset').onclick=reset;

function go(){
  const fid=selFrom.value,tid=selTo.value;
  if(!fid||!tid){routeInfoEl.textContent='Seleziona partenza e destinazione';return;}
  if(fid===tid){routeInfoEl.textContent='Stessa posizione';return;}
  const fNode=nodes.find(n=>String(n.id)===fid);
  const tNode=nodes.find(n=>String(n.id)===tid);
  if(!fNode||!tNode) return;
  const path=dijkstra(fNode.id,tNode.id);
  if(!path){pathIds=[];routeInfoEl.innerHTML='<span style="color:var(--color-text-danger)">Nessun percorso trovato</span>';draw();return;}
  pathIds=path;animatePath();
  const visible=path.map(id=>nodes.find(n=>n.id===id)).filter(n=>n&&n.type!=='incrocio');
  let html='<span style="font-weight:500;color:var(--color-text-primary)">'+(visible.length)+' tappe:</span> ';
  html+=visible.map(n=>n.name||n.type).join(' → ');
  routeInfoEl.innerHTML=html;
  const fc=nodeWXY(fNode);const fp=w2s(fc.x,fc.y);
  offX+=canvas.width/2-fp.x;offY+=canvas.height/2-fp.y;draw();
}
function reset(){
  pathIds=[];animT=0;if(animReq)cancelAnimationFrame(animReq);
  selFrom.value='';selTo.value='';
  routeInfoEl.textContent='Seleziona partenza e destinazione';
  draw();
}

selFrom.onchange=()=>draw();
selTo.onchange=()=>draw();

document.getElementById('fab-btn').onclick=()=>{
  drawer.classList.toggle('open');
  if(drawer.classList.contains('open')){drawerSearch.value='';renderDrawer('');}
};
document.getElementById('drawer-handle').onclick=()=>drawer.classList.remove('open');
drawerSearch.oninput=()=>renderDrawer(drawerSearch.value.toLowerCase());

function renderDrawer(q){
  drawerList.innerHTML='';
  const types=['reception','appartamento','bungalow','servizio'];
  const groups={};
  nodes.filter(n=>n.type!=='incrocio').forEach(n=>{
    const lbl=n.name||(n.type==='reception'?'Reception':n.type);
    if(q&&!lbl.toLowerCase().includes(q)) return;
    (groups[n.type]=groups[n.type]||[]).push(n);
  });
  types.filter(t=>groups[t]?.length).forEach(t=>{
    const sec=document.createElement('div');sec.className='drawer-section';sec.textContent=t;
    drawerList.appendChild(sec);
    groups[t].forEach(n=>{
      const lbl=n.name||(n.type==='reception'?'Reception':n.type);
      const d=document.createElement('div');d.className='drawer-item';
      const isFrom=String(n.id)===selFrom.value;
      const isTo=String(n.id)===selTo.value;
      if(isFrom) d.classList.add('sel-from');
      if(isTo) d.classList.add('sel-to');
      const dot=document.createElement('div');dot.className='node-dot';dot.style.background=NODE_COLORS[n.type]||'#888';
      const sp=document.createElement('span');sp.textContent=lbl;
      d.appendChild(dot);d.appendChild(sp);
      if(isFrom){const b=document.createElement('span');b.className='drawer-badge badge-from';b.textContent='partenza';d.appendChild(b);}
      if(isTo){const b=document.createElement('span');b.className='drawer-badge badge-to';b.textContent='arrivo';d.appendChild(b);}
      d.onclick=()=>{
        if(!selFrom.value||selTo.value){selFrom.value=String(n.id);selTo.value='';}
        else if(!selTo.value&&String(n.id)!==selFrom.value){selTo.value=String(n.id);}
        buildSelects();renderDrawer(drawerSearch.value.toLowerCase());draw();
        const c=nodeWXY(n);const fp=w2s(c.x,c.y);
        offX+=canvas.width/2-fp.x;offY+=canvas.height/2-fp.y;draw();
      };
      drawerList.appendChild(d);
    });
  });
  if(!drawerList.children.length){
    const p=document.createElement('p');p.style.cssText='font-size:13px;color:var(--color-text-secondary);padding:12px';
    p.textContent='Nessun risultato';drawerList.appendChild(p);
  }
}

function buildSelects(){
  [selFrom,selTo].forEach(s=>{
    const cur=s.value;s.innerHTML='<option value="">'+( s===selFrom?'Da…':'A…')+'</option>';
    nodes.filter(n=>n.type!=='incrocio').forEach(n=>{
      const o=document.createElement('option');o.value=n.id;
      o.textContent=n.name||(n.type==='reception'?'Reception':n.type+' '+n.id);
      s.appendChild(o);
    });
    if(cur) s.value=cur;
  });
  const rec=nodes.find(n=>n.type==='reception');
  if(rec&&!selFrom.value) selFrom.value=String(rec.id);
}

function loadGraph(data){
  jsonMeta={mapWidth:data.mapWidth,mapHeight:data.mapHeight};
  const mapW=mapImage?mapImage.width:(data.mapWidth||canvas.width);
  const mapH=mapImage?mapImage.height:(data.mapHeight||canvas.height);
  nodes=data.nodes.map(n=>{
    const wx=n.wx!==undefined?n.wx:(n.xr!==undefined?n.xr*mapW:n.x||0);
    const wy=n.wy!==undefined?n.wy:(n.yr!==undefined?n.yr*mapH:n.y||0);
    return{...n,wx,wy};
  });
  edges=data.edges.map(e=>({...e,pts:(e.pts||[])}));
  graphReady=true;
  buildSelects();
  checkReady();
}

function checkReady(){
  if(!mapReady||!graphReady) return;
  const mapW=mapImage.width,mapH=mapImage.height;
  nodes=nodes.map(n=>n.xr!==undefined?{...n,wx:n.xr*mapW,wy:n.yr*mapH}:n);
  loadingEl.style.display='none';
  fitMap();
}

function loadMapFromURL(url){
  return new Promise(resolve=>{
    const img=new Image();img.crossOrigin='anonymous';
    img.onload=()=>{mapImage=img;mapReady=true;resolve(true);};
    img.onerror=()=>{loadingEl.innerHTML='<p style="color:var(--color-text-danger)">Errore mappa</p>';resolve(false);};
    img.src=url;
  });
}
function loadJSONFromURL(url){
  return fetch(url)
    .then(r=>{if(!r.ok)throw new Error();return r.json();})
    .then(d=>{if(d.nodes&&d.edges)loadGraph(d);})
    .catch(()=>{document.getElementById('loading-msg').textContent='Errore grafo';});
}

resize();
Promise.all([loadMapFromURL(MAP_URL),loadJSONFromURL(JSON_URL)]).then(()=>checkReady());
</script>
