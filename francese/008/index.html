// Text-to-Speech functionality
conjApp.speak = function(text, btn) {
    // Cancel any ongoing speech
    if (window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
    }
    
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'fr-FR';
    utterance.rate = 0.8; // Slightly slower for learning
    
    // Visual feedback
    btn.classList.add('speaking');
    
    utterance.onend = function() {
        btn.classList.remove('speaking');
    };
    
    utterance.onerror = function() {
        btn.classList.remove('speaking');
    };
    
    window.speechSynthesis.speak(utterance);
};

conjApp.quizMode = false;
conjApp.quizStats = {
    total: 0,
    correct: 0,
    incorrect: 0
};

conjApp.setVerb = function(verb) {
    document.getElementById('conjVerbInput').value = verb;
    conjApp.conjugateVerb();
};

conjApp.toggleQuizMode = function() {
    conjApp.quizMode = !conjApp.quizMode;
    conjApp.quizStats = { total: 0, correct: 0, incorrect: 0 };
    
    // Update button appearance
    const btn = document.getElementById('quizToggleBtn');
    if (btn) {
        if (conjApp.quizMode) {
            btn.classList.add('active');
            btn.innerHTML = '📖 Mode Normal';
        } else {
            btn.classList.remove('active');
            btn.innerHTML = '📝 Mode Quiz';
        }
    }
    
    // Re-render current verb if one is displayed
    const input = document.getElementById('conjVerbInput').value.trim().toLowerCase();
    if (input && conjApp.verbDatabase[input]) {
        conjApp.conjugateVerb();
    }
};

conjApp.checkAnswer = function(input, correctAnswer, checkBtn) {
    const userAnswer = input.value.trim().toLowerCase();
    const correct = correctAnswer.toLowerCase();
    
    if (!userAnswer) return;
    
    conjApp.quizStats.total++;
    
    if (userAnswer === correct) {
        input.classList.remove('incorrect');
        input.classList.add('correct');
        checkBtn.classList.remove('incorrect');
        checkBtn.classList.add('correct');
        checkBtn.innerHTML = '✓';
        checkBtn.disabled = true;
        input.disabled = true;
        conjApp.quizStats.correct++;
    } else {
        input.classList.remove('correct');
        input.classList.add('incorrect');
        checkBtn.classList.remove('correct');
        checkBtn.classList.add('incorrect');
        checkBtn.innerHTML = '✗';
        conjApp.quizStats.incorrect++;
        
        // Reset after animation
        setTimeout(function() {
            checkBtn.classList.remove('incorrect');
            checkBtn.innerHTML = '?';
        }, 1500);
    }
    
    conjApp.updateQuizStats();
};

conjApp.setupQuizInputEnter = function(inputId, correctAnswer, checkBtn) {
    const input = document.getElementById(inputId);
    if (input) {
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !input.disabled) {
                conjApp.checkAnswer(input, correctAnswer, checkBtn);
            }
        });
    }
};

conjApp.updateQuizStats = function() {
    const statsDiv = document.getElementById('conjQuizStats');
    if (statsDiv) {
        const percentage = conjApp.quizStats.total > 0 
            ? Math.round((conjApp.quizStats.correct / conjApp.quizStats.total) * 100) 
            : 0;
        
        statsDiv.innerHTML = `
            <div class="conj-stat-item">
                <span class="conj-stat-label">Total</span>
                <span class="conj-stat-value">${conjApp.quizStats.total}</span>
            </div>
            <div class="conj-stat-item">
                <span class="conj-stat-label">Correct</span>
                <span class="conj-stat-value correct">${conjApp.quizStats.correct}</span>
            </div>
            <div class="conj-stat-item">
                <span class="conj-stat-label">Incorrect</span>
                <span class="conj-stat-value incorrect">${conjApp.quizStats.incorrect}</span>
            </div>
            <div class="conj-stat-item">
                <span class="conj-stat-label">Score</span>
                <span class="conj-stat-value">${percentage}%</span>
            </div>
        `;
    }
};

conjApp.conjugateVerb = function() {
    const input = document.getElementById('conjVerbInput').value.trim().toLowerCase();
    const results = document.getElementById('conjResults');

    if (!input) {
        results.innerHTML = '<div class="conj-error">Veuillez entrer un verbe</div>';
        return;
    }

    const verbData = conjApp.verbDatabase[input];

    if (!verbData) {
        results.innerHTML = `<div class="conj-error">Le verbe "${input}" n'est pas encore dans notre base de données. Essayez: ${Object.keys(conjApp.verbDatabase).slice(0, 5).join(', ')}...</div>`;
        return;
    }

    let html = `
        <div class="conj-verb-header">
            <div class="conj-verb-infinitive">${input.charAt(0).toUpperCase() + input.slice(1)}</div>
            <div class="conj-verb-info">${verbData.group}</div>
        </div>
    `;

    // Add quiz stats if in quiz mode
    if (conjApp.quizMode) {
        html += '<div class="conj-quiz-stats" id="conjQuizStats"></div>';
    }

    html += '<div class="conj-grid">';

    html += conjApp.createTenseBlock("Indicatif Présent", verbData.présent, conjApp.pronouns, input);
    html += conjApp.createTenseBlock("Imparfait", verbData.imparfait, conjApp.pronouns, input);
    html += conjApp.createTenseBlock("Passé Simple", verbData.passé_simple, conjApp.pronouns, input);
    html += conjApp.createTenseBlock("Futur", verbData.futur, conjApp.pronouns, input);
    html += conjApp.createTenseBlock("Conditionnel", verbData.conditionnel, conjApp.pronouns, input);
    html += conjApp.createTenseBlock("Subjonctif Présent", verbData.subjonctif, conjApp.pronouns, input);

    const impératifPronouns = ["", "tu", "", "nous", "vous", ""];
    html += conjApp.createTenseBlock("Impératif", verbData.impératif, impératifPronouns, input, true);

    html += `
        <div class="conj-tense-block">
            <h3 class="conj-tense-title">Participes</h3>
            <ul class="conj-list">
    `;

    if (conjApp.quizMode) {
        html += `
                <li class="conj-item">
                    <span class="conj-pronoun">Présent</span>
                    <div class="conj-quiz-answer">
                        <input type="text" class="conj-quiz-input" id="quiz_participe_present" placeholder="Entrez la forme..."
                            onkeypress="if(event.key==='Enter' && !this.disabled) conjApp.checkAnswer(this, '${verbData.participe_présent}', this.nextElementSibling)">
                        <button class="conj-check-btn" onclick="conjApp.checkAnswer(this.previousElementSibling, '${verbData.participe_présent}', this)">?</button>
                    </div>
                </li>
                <li class="conj-item">
                    <span class="conj-pronoun">Passé</span>
                    <div class="conj-quiz-answer">
                        <input type="text" class="conj-quiz-input" id="quiz_participe_passe" placeholder="Entrez la forme..."
                            onkeypress="if(event.key==='Enter' && !this.disabled) conjApp.checkAnswer(this, '${verbData.participe_passé}', this.nextElementSibling)">
                        <button class="conj-check-btn" onclick="conjApp.checkAnswer(this.previousElementSibling, '${verbData.participe_passé}', this)">?</button>
                    </div>
                </li>
        `;
    } else {
        html += `
                <li class="conj-item">
                    <span class="conj-pronoun">Présent</span>
                    <span class="conj-verb-form">${verbData.participe_présent}</span>
                    <button class="conj-speaker-btn" onclick="conjApp.speak('${verbData.participe_présent}', this)" title="Écouter la prononciation">🔊</button>
                </li>
                <li class="conj-item">
                    <span class="conj-pronoun">Passé</span>
                    <span class="conj-verb-form">${verbData.participe_passé}</span>
                    <button class="conj-speaker-btn" onclick="conjApp.speak('${verbData.participe_passé}', this)" title="Écouter la prononciation">🔊</button>
                </li>
        `;
    }

    html += `
            </ul>
        </div>
    `;

    html += '</div>';
    results.innerHTML = html;
    
    if (conjApp.quizMode) {
        conjApp.updateQuizStats();
    }
};

conjApp.createTenseBlock = function(title, forms, pronouns, infinitive, isImperative) {
    isImperative = isImperative || false;
    let html = `
        <div class="conj-tense-block">
            <h3 class="conj-tense-title">${title}</h3>
            <ul class="conj-list">
    `;

    for (let i = 0; i < forms.length; i++) {
        if (forms[i] !== null) {
            const pronoun = isImperative && pronouns[i] === "" ? "" : pronouns[i];
            const fullPhrase = pronoun ? `${pronoun} ${forms[i]}` : forms[i];
            const quizId = `quiz_${title.replace(/\s+/g, '_')}_${i}`;
            
            if (conjApp.quizMode) {
                html += `
                    <li class="conj-item">
                        <span class="conj-pronoun">${pronoun}</span>
                        <div class="conj-quiz-answer">
                            <input type="text" class="conj-quiz-input" id="${quizId}" placeholder="Entrez la forme..." 
                                onkeypress="if(event.key==='Enter' && !this.disabled) conjApp.checkAnswer(this, '${forms[i]}', this.nextElementSibling)">
                            <button class="conj-check-btn" onclick="conjApp.checkAnswer(this.previousElementSibling, '${forms[i]}', this)">?</button>
                        </div>
                    </li>
                `;
            } else {
                html += `
                    <li class="conj-item">
                        <span class="conj-pronoun">${pronoun}</span>
                        <span class="conj-verb-form">${forms[i]}</span>
                        <button class="conj-speaker-btn" onclick="conjApp.speak('${fullPhrase}', this)" title="Écouter la prononciation">🔊</button>
                    </li>
                `;
            }
        }
    }

    html += `
            </ul>
        </div>
    `;

    return html;
};
</script>

(function() {
    function setupEnterKey() {

        if (input) {
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    conjApp.conjugateVerb();

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', setupEnterKey);
    } else {

})();
